<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E5E54">
<title>DOCTRACK · Indo Japan</title>
<link rel="manifest" href='data:application/json,{"name":"DOCTRACK","short_name":"DOCTRACK","start_url":".","display":"standalone","background_color":"%23F4F6F5","theme_color":"%230E5E54"}'>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--paper:#F4F6F5;--card:#fff;--ink:#13211E;--muted:#5A6B66;--teal:#0E5E54;--tealsoft:#E2EEEB;--amber:#C97B12;--rust:#B3422F;--line:#D8DEDC}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px}
  #root{max-width:760px;margin:0 auto;padding:16px;min-height:100vh}
  .brand{font-weight:800;letter-spacing:.04em;color:var(--teal);font-size:20px}
  .brand small{color:var(--muted);font-weight:500;letter-spacing:0;font-size:12px;display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:14px}
  h2{font-size:17px;margin-bottom:10px}
  label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px;font-weight:600}
  input,select,button,textarea{font:inherit}
  input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .btn{width:100%;padding:12px;border:none;border-radius:8px;background:var(--teal);color:#fff;font-weight:700;cursor:pointer;margin-top:14px}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:#fff;color:var(--teal);border:1.5px solid var(--teal)}
  .btn.small{width:auto;padding:8px 14px;margin-top:0;font-size:13px}
  .row{display:flex;gap:10px;align-items:center}
  .err{color:var(--rust);font-size:13px;margin-top:8px}
  .ok{color:var(--teal);font-size:13px;margin-top:8px}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
  .pill{font-size:11px;background:var(--tealsoft);color:var(--teal);padding:3px 9px;border-radius:99px;font-weight:700}
  .doc{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
  .doc:first-of-type{border-top:none}
  .doc b{font-size:14px}
  .doc .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .exp{font-size:12px;font-weight:700;white-space:nowrap}
  .exp.soon{color:var(--amber)} .exp.over{color:var(--rust)} .exp.fine{color:var(--teal)}
  .fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .fieldgrid .full{grid-column:1/-1}
  .note{font-size:12px;color:var(--muted);background:var(--paper);border-radius:8px;padding:10px;margin-top:12px;line-height:1.5}
  .spin{display:inline-block;width:16px;height:16px;border:2.5px solid var(--tealsoft);border-top-color:var(--teal);border-radius:50%;animation:s .7s linear infinite;vertical-align:-3px;margin-right:8px}
  @keyframes s{to{transform:rotate(360deg)}}
  .uploadbox{border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--muted);cursor:pointer;background:#fff}
  .uploadbox:hover{border-color:var(--teal);color:var(--teal)}
  a{color:var(--teal)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef } = React;

/* ════════════════════════════════════════════════════════════
   CONFIG
   ✅ Supabase URL is already filled in for you.
   👉 You only need to do ONE thing: replace the anon key below.
      Replace  PASTE_SUPABASE_ANON_KEY_HERE  with the long key
      that starts with  eyJ...  (keep the quotation marks!)
   ════════════════════════════════════════════════════════════ */
const SUPABASE_URL      = "https://lxnsipefybuorwtsxhlw.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4bnNpcGVmeWJ1b3J3dHN4aGx3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3MTU5NzUsImV4cCI6MjA5ODI5MTk3NX0.iIH1ZRXbUUiPklMOo2akQYipP3BR6h8UtnHVKzlJvOI";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ════════════════════════════════════════════════════════════
   AI PROVIDER LAYER — the swappable module.
   Today: Gemini free tier, key kept in this browser only
   (localStorage; Phase-0 convenience — moves server-side in
   Phase 2). Later: change provider to 'claude' and only this
   block changes.
   ════════════════════════════════════════════════════════════ */
const AI = {
  provider: "gemini",
  model: "gemini-2.5-flash",
  getKey: () => localStorage.getItem("doctrack_gemini_key") || "",
  setKey: (k) => localStorage.setItem("doctrack_gemini_key", k.trim()),

  async extractDocument(base64, mimeType) {
    const key = AI.getKey();
    if (!key) throw new Error("No Gemini API key set — open Settings.");
    const prompt = `You are a document intelligence engine for an Indian business group.
Read this document and return ONLY a JSON object (no markdown, no fences) with these keys:
{"doc_type": "(e.g. Fire NOC, Trade License, Insurance Policy, Lease Agreement, AMC, Work Order, Visa, Vehicle RC, PUC, Invoice, Other)",
 "title": "short human title",
 "issuer": "issuing authority or company or null",
 "holder": "person/company the document belongs to or null",
 "ref_number": "main reference/policy/license number or null",
 "issue_date": "YYYY-MM-DD or null",
 "expiry_date": "YYYY-MM-DD or null (renewal/expiry/valid-till date)",
 "amount": "main monetary amount as a number, or null",
 "summary": "one sentence on what this document is"}
Dates in Indian documents are usually DD/MM/YYYY — convert correctly. If unsure about a field, use null.`;
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${AI.model}:generateContent?key=${key}`,
      { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ parts: [
          { text: prompt },
          { inline_data: { mime_type: mimeType, data: base64 } }
        ]}]})});
    if (!res.ok) {
      const t = await res.text();
      throw new Error(`Gemini error ${res.status}: ${t.slice(0,180)}`);
    }
    const data = await res.json();
    let text = data?.candidates?.[0]?.content?.parts?.[0]?.text || "";
    text = text.replace(/```json|```/g, "").trim();
    return JSON.parse(text);
  }
};

/* ════════ helpers ════════ */
const fileToBase64 = (file) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(r.result.split(",")[1]);
  r.onerror = () => rej(new Error("Could not read file"));
  r.readAsDataURL(file);
});
const daysTo = (d) => d ? Math.ceil((new Date(d) - new Date()) / 86400000) : null;
const expiryClass = (n) => n === null ? "" : n < 0 ? "over" : n <= 30 ? "soon" : "fine";
const expiryLabel = (n) => n === null ? "" : n < 0 ? `${-n}d overdue` : n === 0 ? "today" : `${n}d left`;

/* ════════ Login ════════ */
function Login() {
  const [email, setEmail] = useState(""); const [pw, setPw] = useState("");
  const [mode, setMode] = useState("in"); const [msg, setMsg] = useState(null); const [busy, setBusy] = useState(false);
  const go = async () => {
    setBusy(true); setMsg(null);
    const fn = mode === "in"
      ? sb.auth.signInWithPassword({ email, password: pw })
      : sb.auth.signUp({ email, password: pw });
    const { error } = await fn;
    setBusy(false);
    if (error) setMsg({ t: "err", m: error.message });
    else if (mode === "up") setMsg({ t: "ok", m: "Account created — check email if confirmation is on, then sign in." });
  };
  return (
    <div className="card" style={{maxWidth:420, margin:"60px auto"}}>
      <div className="brand">DOCTRACK<small>Indo Japan · Document Intelligence</small></div>
      <label>Email</label>
      <input type="email" value={email} onChange={e=>setEmail(e.target.value)} />
      <label>Password</label>
      <input type="password" value={pw} onChange={e=>setPw(e.target.value)} />
      <button className="btn" disabled={busy} onClick={go}>{busy ? "…" : mode === "in" ? "Sign in" : "Create account"}</button>
      <button className="btn ghost" onClick={()=>setMode(mode==="in"?"up":"in")}>{mode==="in"?"First time? Create account":"Have an account? Sign in"}</button>
      {msg && <div className={msg.t}>{msg.m}</div>}
    </div>
  );
}

/* ════════ Settings (Gemini key) ════════ */
function Settings({ onClose }) {
  const [k, setK] = useState(AI.getKey());
  return (
    <div className="card">
      <h2>Settings — AI provider</h2>
      <label>Gemini API key (from aistudio.google.com → Get API key)</label>
      <input type="text" value={k} onChange={e=>setK(e.target.value)} placeholder="AIza…" />
      <button className="btn" onClick={()=>{AI.setKey(k); onClose();}}>Save key</button>
      <div className="note">Phase-0 note: this key is stored only in this browser (localStorage) for personal testing.
      Before staff rollout (Phase 2) it moves to a Supabase Edge Function so it is never exposed client-side.
      Provider: <b>{AI.provider} / {AI.model}</b> — swappable to Claude API later by editing one block of code.</div>
    </div>
  );
}

/* ════════ Upload & Extract ════════ */
function Uploader({ entities, onSaved }) {
  const [stage, setStage] = useState("idle"); // idle | extracting | confirm | saving
  const [file, setFile] = useState(null);
  const [fields, setFields] = useState(null);
  const [entityId, setEntityId] = useState("");
  const [err, setErr] = useState(null);
  const inputRef = useRef();

  const pick = async (f) => {
    if (!f) return;
    setFile(f); setErr(null); setStage("extracting");
    try {
      const supported = ["application/pdf","image/jpeg","image/png","image/webp","image/heic"];
      if (!supported.includes(f.type)) throw new Error(`Phase 0 handles PDF & images. "${f.type||f.name}" support (Word/Excel) arrives in Phase 1.`);
      const b64 = await fileToBase64(f);
      const out = await AI.extractDocument(b64, f.type);
      setFields({ ...out, entity_id: entityId || entities[0]?.id });
      setStage("confirm");
    } catch (e) { setErr(e.message); setStage("idle"); }
  };

  const save = async () => {
    setStage("saving"); setErr(null);
    try {
      const path = `${Date.now()}_${file.name.replace(/[^\w.\-]/g,"_")}`;
      const { error: upErr } = await sb.storage.from("documents").upload(path, file);
      if (upErr) throw upErr;
      const { error: dbErr } = await sb.from("documents").insert({
        entity_id: fields.entity_id, title: fields.title, doc_type: fields.doc_type,
        issuer: fields.issuer, holder: fields.holder, ref_number: fields.ref_number,
        issue_date: fields.issue_date || null, expiry_date: fields.expiry_date || null,
        amount: fields.amount || null, extracted: fields, ai_provider: AI.provider,
        storage_path: path, file_type: file.type.includes("pdf") ? "pdf" : "image"
      });
      if (dbErr) throw dbErr;
      setStage("idle"); setFile(null); setFields(null); onSaved();
    } catch (e) { setErr(e.message); setStage("confirm"); }
  };

  const F = (k, label, type="text") => (
    <div className={k==="title"||k==="summary"?"full":""}>
      <label>{label}</label>
      <input type={type} value={fields[k] ?? ""} onChange={e=>setFields({...fields,[k]:e.target.value})}/>
    </div>
  );

  if (stage === "extracting") return <div className="card"><span className="spin"></span>Reading document with {AI.model}…</div>;

  if (stage === "confirm" || stage === "saving") return (
    <div className="card">
      <h2>Confirm extracted details <span className="pill">AI proposed — you approve</span></h2>
      <div className="fieldgrid">
        {F("title","Title")}
        <div><label>Entity</label>
          <select value={fields.entity_id} onChange={e=>setFields({...fields,entity_id:e.target.value})}>
            {entities.map(en=><option key={en.id} value={en.id}>{en.name}</option>)}
          </select></div>
        {F("doc_type","Document type")}
        {F("ref_number","Reference no.")}
        {F("issuer","Issuer")}
        {F("holder","Holder")}
        {F("issue_date","Issue date","date")}
        {F("expiry_date","Expiry / renewal date","date")}
        {F("amount","Amount (₹)","number")}
      </div>
      {fields.summary && <div className="note">{fields.summary}</div>}
      <button className="btn" disabled={stage==="saving"} onClick={save}>{stage==="saving"?"Saving…":"Save to vault"}</button>
      <button className="btn ghost" onClick={()=>{setStage("idle");setFile(null);}}>Discard</button>
      {err && <div className="err">{err}</div>}
    </div>
  );

  return (
    <div className="card">
      <h2>Add a document</h2>
      <label>Entity</label>
      <select value={entityId} onChange={e=>setEntityId(e.target.value)}>
        {entities.map(en=><option key={en.id} value={en.id}>{en.name}</option>)}
      </select>
      <div style={{marginTop:12}} className="uploadbox" onClick={()=>inputRef.current.click()}>
        📷 Tap to photograph or choose a file<br/>
        <span style={{fontSize:12}}>PDF · JPG · PNG · screenshots (Word/Excel: Phase 1)</span>
      </div>
      <input ref={inputRef} type="file" accept="application/pdf,image/*" capture="environment" hidden
             onChange={e=>pick(e.target.files[0])}/>
      {err && <div className="err">{err}</div>}
    </div>
  );
}

/* ════════ Vault list ════════ */
function Vault({ docs }) {
  if (!docs.length) return <div className="card"><h2>Vault</h2><div className="note">No documents yet — add your first one above. Suggested first test: photograph a Fire NOC or an insurance policy.</div></div>;
  return (
    <div className="card">
      <h2>Vault · {docs.length} document{docs.length>1?"s":""}</h2>
      {docs.map(d=>{
        const n = daysTo(d.expiry_date);
        return (<div className="doc" key={d.id}>
          <div><b>{d.title || d.doc_type || "Untitled"}</b>
            <div className="meta">{[d.doc_type, d.entities?.name, d.ref_number].filter(Boolean).join(" · ")}</div></div>
          <div className={"exp "+expiryClass(n)}>{d.expiry_date ? `${d.expiry_date} · ${expiryLabel(n)}` : "no expiry"}</div>
        </div>);
      })}
    </div>
  );
}

/* ════════ App ════════ */
function App() {
  const [session, setSession] = useState(undefined);
  const [entities, setEntities] = useState([]);
  const [docs, setDocs] = useState([]);
  const [showSettings, setShowSettings] = useState(false);

  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_e,s)=>setSession(s));
    return ()=>sub.subscription.unsubscribe();
  },[]);

  const load = async ()=>{
    const [e,d] = await Promise.all([
      sb.from("entities").select("*").order("name"),
      sb.from("documents").select("*, entities(name)").order("expiry_date",{ascending:true,nullsFirst:false})
    ]);
    setEntities(e.data||[]); setDocs(d.data||[]);
  };
  useEffect(()=>{ if(session) load(); },[session]);

  if (session === undefined) return <div className="card" style={{marginTop:60,textAlign:"center"}}><span className="spin"></span>Loading…</div>;
  if (!session) return <Login/>;

  return (<div>
    <div className="topbar">
      <div className="brand">DOCTRACK<small>Phase 0 · {session.user.email}</small></div>
      <div className="row">
        <button className="btn small ghost" onClick={()=>setShowSettings(s=>!s)}>⚙ Settings</button>
        <button className="btn small ghost" onClick={()=>sb.auth.signOut()}>Sign out</button>
      </div>
    </div>
    {(!AI.getKey() || showSettings) && <Settings onClose={()=>setShowSettings(false)}/>}
    <Uploader entities={entities} onSaved={load}/>
    <Vault docs={docs}/>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
