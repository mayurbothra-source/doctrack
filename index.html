/* ══ JOIN ORG ══ */
function JoinOrg({user,onDone,onSkip}){
  const[code,setCode]=useState("");const[busy,setBusy]=useState(false);const[err,setErr]=useState(null);
  const join=async()=>{
    if(!code.trim()){setErr("Enter the invite code.");return;}
    setBusy(true);setErr(null);
    try{
      const{data:org,error}=await sb.from("organisations").select("*").eq("invite_code",code.trim().toUpperCase()).maybeSingle();
      if(error)throw error;
      if(!org){setErr("Invalid invite code. Check with your administrator.");setBusy(false);return;}
      const{data:roles}=await sb.from("custom_roles").select("*").eq("org_id",org.id);
      const staff=(roles||[]).find(r=>!r.permissions?.team_manage)||roles?.[0];
      await sb.from("org_members").insert({org_id:org.id,user_id:user.id,role_id:staff?.id,is_org_admin:false});
      await sb.from("profiles").update({account_type:"corporate",org_id:org.id,plan:org.plan}).eq("user_id",user.id);
      onDone();
    }catch(e){setErr(e.message||"Could not join.");setBusy(false);}
  };
  return <div className="wrap" style={{maxWidth:440}}>
    <div className="lbrand" style={{marginTop:30,marginBottom:18}}>
      <div className="lbn" style={{fontSize:24}}>DOCTRACK <span className="lbt" style={{fontSize:16}}>· Tokei</span></div>
      <div className="lbg">Join your organisation</div>
    </div>
    <div className="card" style={{marginTop:0}}>
      <label>Invite code</label>
      <input type="text" value={code} onChange={e=>setCode(e.target.value.toUpperCase())} placeholder="e.g. A1B2C3D4" style={{textAlign:"center",fontSize:18,letterSpacing:".12em",fontFamily:"monospace"}}/>
      <div style={{fontSize:12,color:"var(--mu)",marginTop:5}}>Your administrator will share this code with you.</div>
      <button className="btn bp" disabled={busy} onClick={join}>{busy?<React.Fragment><span className="spin"/>Joining…</React.Fragment>:"Join organisation"}</button>
      <button className="btn bg" style={{marginTop:7}} onClick={onSkip}>Create a new organisation instead</button>
      {err&&<div className="al ae">{err}</div>}
    </div>
  </div>;
}

/* ══ APP ROOT ══ */
function App(){
  const[ses,setSes]=useState(undefined);
  const[view,setView]=useState("landing");   // landing|auth|wizard|join|app
  const[acctPick,setAcctPick]=useState(null);
  const[prof,setProf]=useState(null);const[org,setOrg]=useState(null);
  const[docs,setDocs]=useState([]);const[folders,setFolders]=useState([]);
  const[actions,setActions]=useState([]);const[units,setUnits]=useState([]);const[notifs,setNotifs]=useState([]);
  const[loading,setLoading]=useState(false);const[lerr,setLerr]=useState(null);
  const[tab,setTab]=useState("home");const[openDoc,setOpenDoc]=useState(null);
  const[showChat,setShowChat]=useState(false);const[showNotif,setShowNotif]=useState(false);
  const[preloaded,setPre]=useState(null);

  useEffect(()=>{
    if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js",{scope:"./"}).catch(()=>{});
    if(window.location.search.includes("incoming=1")&&"caches"in window){
      caches.open("tokei-share-v1").then(c=>c.match("/incoming-share").then(async r=>{
        if(r){const b=await r.blob();const n=decodeURIComponent(r.headers.get("X-File-Name")||"shared");
          setPre(new File([b],n,{type:b.type||"application/octet-stream"}));c.delete("/incoming-share");}
      })).catch(()=>{});
      window.history.replaceState({},"",window.location.pathname);
    }
  },[]);

  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSes(data.session));
    const{data:sub}=sb.auth.onAuthStateChange((_e,s)=>setSes(s));
    return()=>sub.subscription.unsubscribe();
  },[]);

  const load=useCallback(async()=>{
    setLoading(true);setLerr(null);
    try{
      const{data:{user},error:ue}=await sb.auth.getUser();
      if(ue||!user)throw new Error("Session expired — please sign in again.");
      let{data:p,error:pe}=await sb.from("profiles").select("*").eq("user_id",user.id).maybeSingle();
      if(pe)throw pe;
      if(!p){
        const pt=localStorage.getItem("tokei_pending_type")||"individual";
        const pn=localStorage.getItem("tokei_pending_name")||"";
        const{error:ie}=await sb.from("profiles").insert({user_id:user.id,email:user.email,full_name:pn,role:"member",plan:"free",account_type:pt});
        if(ie)throw ie;
        p={user_id:user.id,email:user.email,full_name:pn,role:"member",plan:"free",account_type:pt,org_id:null};
      }
      const pendType=localStorage.getItem("tokei_pending_type");
      if(pendType&&p.account_type!==pendType&&!p.org_id){
        await sb.from("profiles").update({account_type:pendType}).eq("user_id",user.id);
        p.account_type=pendType;
      }
      setProf(p);
      if(p.account_type==="corporate"&&!p.org_id){
        localStorage.removeItem("tokei_pending_type");
        setView("orgchoice");setLoading(false);return;
      }
      localStorage.removeItem("tokei_pending_type");localStorage.removeItem("tokei_pending_name");
      let orgData=null;
      if(p.org_id){
        const{data:o}=await sb.from("organisations").select("*").eq("id",p.org_id).maybeSingle();
        orgData=o;setOrg(o);
        const{data:u}=await sb.from("org_units").select("*").eq("org_id",p.org_id).order("name");
        setUnits(u||[]);
      }
      const[d,f,a,n]=await Promise.all([
        sb.from("documents").select("*").order("expiry_date",{ascending:true,nullsFirst:false}),
        sb.from("folders").select("*").order("name"),
        sb.from("action_items").select("*").order("due_date",{ascending:true,nullsFirst:false}),
        sb.from("notifications").select("*").eq("user_id",user.id).order("created_at",{ascending:false}).limit(20)
      ]);
      setDocs(d.data||[]);setFolders(f.data||[]);setActions(a.data||[]);setNotifs(n.data||[]);
      setView("app");
    }catch(e){setLerr(e?.message||"Failed to load.");}
    finally{setLoading(false);}
  },[]);

  useEffect(()=>{if(ses)load();else if(ses===null&&view==="app")setView("landing");},[ses]);

  const ctx={userId:ses?.user?.id,email:ses?.user?.email,acct:prof?.account_type||"individual",
    plan:prof?.plan||"free",orgId:prof?.org_id||null,org,orgName:org?.name,sector:org?.sector||"general",
    docs,folders,actions,units,isOrgAdmin:prof?.role==="admin"};

  if(ses===undefined)return <div style={{textAlign:"center",marginTop:110}}>
    <div style={{fontSize:32,marginBottom:10}}>📋</div>
    <div className="lbn" style={{fontSize:22}}>DOCTRACK <span className="lbt" style={{fontSize:15}}>· Tokei</span></div>
    <div style={{marginTop:14,color:"var(--mu)"}}><span className="spin"/>Starting…</div></div>;

  if(!ses){
    if(view==="auth")return <Auth acctType={acctPick} onBack={()=>setView("landing")}/>;
    return <Landing onPick={t=>{setAcctPick(t);setView("auth");}}/>;
  }

  if(lerr)return <div className="wrap"><div className="card" style={{marginTop:40}}>
    <div className="al ae">{lerr}</div>
    <button className="btn bp" onClick={load}>Retry</button>
    <button className="btn bg" style={{marginTop:7}} onClick={()=>sb.auth.signOut()}>Sign out</button></div></div>;

  if(view==="orgchoice")return <div className="wrap" style={{maxWidth:440}}>
    <div className="lbrand" style={{marginTop:30,marginBottom:18}}>
      <div className="lbn" style={{fontSize:24}}>DOCTRACK <span className="lbt" style={{fontSize:16}}>· Tokei</span></div>
      <div className="lbg">Set up your organisation</div></div>
    <div className="card" style={{marginTop:0}}>
      <button className="btn bp" onClick={()=>setView("wizard")}>🏢 Create a new organisation</button>
      <button className="btn bg" style={{marginTop:9}} onClick={()=>setView("join")}>🔑 Join with an invite code</button>
      <button className="btn bg" style={{marginTop:9}} onClick={async()=>{
        await sb.from("profiles").update({account_type:"individual"}).eq("user_id",ses.user.id);load();}}>
        👤 Use as personal account instead</button>
    </div></div>;
  if(view==="wizard")return <OrgWizard user={ses.user} onDone={load}/>;
  if(view==="join")return <JoinOrg user={ses.user} onDone={load} onSkip={()=>setView("wizard")}/>;
  if(loading&&!prof)return <div style={{textAlign:"center",marginTop:110,color:"var(--mu)"}}><span className="spin"/>Loading your vault…</div>;

  const isCorp=ctx.acct==="corporate";
  const isLoanSector=ctx.sector==="banking-loans";
  const plan=gp(ctx.plan,ctx.acct);
  const unread=notifs.filter(n=>!n.read).length;
  const overdueCount=docs.filter(d=>{const n=daysTo(d.expiry_date);return n!==null&&n<0;}).length
    +actions.filter(a=>a.status==="pending"&&a.due_date&&daysTo(a.due_date)<0).length;

  const markRead=async()=>{if(unread){await sb.from("notifications").update({read:true}).eq("user_id",ctx.userId).eq("read",false);
    setNotifs(notifs.map(n=>({...n,read:true})));}};

  const TABS=isCorp
    ?[["home","🏠","Home"],["vault","📁","Vault"],["actions","✓","Actions"],["timeline","📅","Timeline"],
      isLoanSector?["loans","💳","Loans"]:["team","👥","Team"]]
    :[["home","🏠","Home"],["vault","📁","Vault"],["actions","💊","Actions"],["timeline","📅","Timeline"],["settings","⚙","More"]];

  return <React.Fragment>
    <div className="wrap">
      <div className="topbar">
        <div><span className="brand">DOCTRACK <em>· Tokei</em></span>
          <span className="brand-sub">{isCorp?(org?.name||"Organisation"):(prof?.full_name||ctx.email)}</span></div>
        <div className="ta">
          <span className="badge btl">{plan.b}</span>
          <div className="nbell" onClick={()=>{setShowNotif(!showNotif);markRead();}}>
            <span style={{fontSize:19}}>🔔</span>{unread>0&&<span className="nbg">{unread}</span>}</div>
          <button className="btn bg bsm" onClick={()=>sb.auth.signOut()}>Exit</button>
        </div>
      </div>

      {showNotif&&<div className="card" style={{marginTop:8}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
          <h3 style={{marginBottom:0}}>Notifications</h3>
          <button className="btn bg bsm" onClick={()=>setShowNotif(false)}>✕</button></div>
        {notifs.length===0?<div style={{color:"var(--mu)",fontSize:13,padding:10,textAlign:"center"}}>No notifications yet.</div>
          :notifs.slice(0,10).map(n=><div key={n.id} style={{padding:"9px 0",borderTop:"1px solid var(--brd)"}}>
            <div style={{fontWeight:600,fontSize:13.5}}>{n.title}</div>
            <div style={{fontSize:12,color:"var(--mu)",marginTop:1}}>{n.body}</div></div>)}
      </div>}

      {preloaded&&<div className="al aw">📨 File received from another app — analyse it below.</div>}
      {openDoc&&<Detail doc={openDoc} ctx={ctx} onClose={()=>setOpenDoc(null)} onDeleted={()=>{setOpenDoc(null);load();}} onChanged={load}/>}

      {tab==="home"&&<React.Fragment>
        {overdueCount>0&&<div className="al ae"><b>⚠️ {overdueCount} item{overdueCount>1?"s":""} overdue</b> — check Vault and Actions.</div>}
        {isCorp&&<div style={{display:"flex",alignItems:"center",gap:7,marginTop:12,fontSize:12.5,color:"var(--mu)"}}>
          <span style={{fontSize:17}}>{SECTORS[ctx.sector]?.i}</span>{SECTORS[ctx.sector]?.n}</div>}
        <Uploader ctx={ctx} onSaved={load} preloaded={preloaded} onClearPre={()=>setPre(null)}/>
        <Vault ctx={ctx} onOpen={setOpenDoc} loading={loading}/>
      </React.Fragment>}
      {tab==="vault"&&<Vault ctx={ctx} onOpen={setOpenDoc} loading={loading}/>}
      {tab==="actions"&&<Actions ctx={ctx} onRefresh={load}/>}
      {tab==="timeline"&&<Timeline ctx={ctx} onOpen={setOpenDoc}/>}
      {tab==="loans"&&isCorp&&<LoanModule ctx={ctx} onRefresh={load}/>}
      {tab==="team"&&isCorp&&<TeamPanel ctx={ctx} onRefresh={load}/>}
      {tab==="settings"&&<Settings ctx={ctx} onClose={()=>setTab("home")} onRefresh={load}/>}
      {isCorp&&tab==="team"&&<div style={{marginTop:12}}><Settings ctx={ctx} onClose={()=>setTab("home")} onRefresh={load}/></div>}
    </div>

    {!showChat&&<button className="chat-btn" onClick={()=>setShowChat(true)}>💬</button>}
    {showChat&&<AIChat ctx={ctx} onClose={()=>setShowChat(false)}/>}

    <div className="bnav">
      {TABS.map(([k,i,l])=><button key={k} className={"bn"+(tab===k?" on":"")} onClick={()=>{setTab(k);setOpenDoc(null);}}>
        <span className="bni">{i}</span><span>{l}</span></button>)}
    </div>
  </React.Fragment>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
if("serviceWorker"in navigator){navigator.serviceWorker.register("./sw.js",{scope:"./"}).catch(function(){});}
window.addEventListener("DOMContentLoaded",function(){
  try{
    var src=document.getElementById("appsrc").textContent;
    var out=Babel.transform(src,{presets:[["react",{runtime:"classic"}]]}).code;
    var s=document.createElement("script");s.textContent=out;document.body.appendChild(s);
  }catch(e){
    document.getElementById("root").innerHTML='<div style="max-width:520px;margin:60px auto;padding:22px;font-family:sans-serif;color:#B83228;background:#FDF2F0;border-radius:12px"><b>Startup error:</b><br><br>'+(e&&e.message?e.message:String(e))+'</div>';
    console.error("Tokei startup:",e);
  }
});
</script>
</body>
</html>
