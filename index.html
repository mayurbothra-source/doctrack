<style>
:root{
  --bg:#FFFFFF; --surface:#F4F7FA; --surface2:#EBF0F5;
  --border:#DDE4ED; --border2:#C5CFD9;
  --ink:#1A2433; --ink2:#374151; --muted:#6B7A8D; --muted2:#9AA5B1;
  --teal:#0D5C4E; --teal2:#0F7060; --teal-bg:#EAF4F1; --teal-border:#B0D4CB;
  --red:#C0392B; --red-bg:#FDF2F0; --red-border:#EFB8B3;
  --amber:#B7770D; --amber-bg:#FEF9EC; --amber-border:#EDD48A;
  --green:#0A7D5E; --green-bg:#EEF9F4; --green-border:#A0D9C4;
  --blue:#1D6FA4; --blue-bg:#EDF5FB;
  --shadow:0 1px 4px rgba(26,36,51,.07),0 2px 8px rgba(26,36,51,.04);
  --shadow-md:0 4px 14px rgba(26,36,51,.09),0 2px 4px rgba(26,36,51,.05);
  --r:12px; --r-sm:8px; --r-lg:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
#root{max-width:700px;margin:0 auto;padding:14px 16px 80px}

/* Cards */
.card{background:var(--bg);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-top:14px;border:1px solid var(--border)}
.card-surface{background:var(--surface);border-radius:var(--r);padding:18px;margin-top:14px;border:1px solid var(--border)}

/* Typography */
h2{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-bottom:12px;color:var(--ink)}
h3{font-size:14px;font-weight:600;color:var(--ink2);margin-bottom:8px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em}

/* Inputs */
input,select,button,textarea{font:inherit}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],input[type=search],select{
  width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--r-sm);background:var(--bg);color:var(--ink);
  transition:border-color .15s,box-shadow .15s;outline:none}
input:focus,select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(13,92,78,.12)}
textarea{width:100%;resize:vertical;min-height:80px;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--r-sm)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border:none;border-radius:var(--r-sm);font-weight:600;font-size:14px;cursor:pointer;transition:all .15s;width:100%;margin-top:10px;letter-spacing:.01em}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{background:var(--teal2)}
.btn-primary:disabled{opacity:.45;cursor:default}
.btn-ghost{background:transparent;color:var(--teal);border:1.5px solid var(--teal-border)}
.btn-ghost:hover{background:var(--teal-bg)}
.btn-danger{background:transparent;color:var(--red);border:1.5px solid var(--red-border)}
.btn-danger:hover{background:var(--red-bg)}
.btn-sm{padding:8px 16px;font-size:13px;margin-top:0;width:auto}
.btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn-row .btn{flex:1;min-width:100px;margin-top:0}

/* Status badges */
.badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px}
.badge-teal{background:var(--teal-bg);color:var(--teal)}
.badge-amber{background:var(--amber-bg);color:var(--amber)}
.badge-red{background:var(--red-bg);color:var(--red)}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-blue{background:var(--blue-bg);color:var(--blue)}

/* Alerts */
.alert{padding:12px 16px;border-radius:var(--r-sm);font-size:13.5px;line-height:1.5;margin-top:12px}
.alert-err{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.alert-ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.alert-warn{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.alert-info{background:var(--teal-bg);color:var(--teal);border:1px solid var(--teal-border)}

/* Spinner */
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid var(--teal-border);border-top-color:var(--teal);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:6px;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}

/* Topbar */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 0 8px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}
.brand{font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--teal)}
.brand-sub{font-size:11px;font-weight:400;color:var(--muted);display:block;letter-spacing:.02em}
.topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Dashboard stat grid */
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:2px}
.stat{padding:12px 8px;border-radius:var(--r-sm);text-align:center;cursor:pointer;border:1.5px solid transparent;background:var(--surface);transition:all .15s}
.stat.active-band{border-color:var(--teal);background:var(--teal-bg)}
.stat .sn{font-size:24px;font-weight:800;line-height:1.1}
.stat .sl{font-size:10px;font-weight:600;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
.stat-over .sn{color:var(--red)}
.stat-soon .sn{color:var(--amber)}
.stat-ok .sn{color:var(--green)}

/* Document list */
.doc-row{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-top:1px solid var(--border);cursor:pointer;transition:opacity .12s}
.doc-row:hover{opacity:.75}
.doc-row:first-child{border-top:none}
.doc-icon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:var(--surface)}
.doc-title{font-size:14px;font-weight:600;color:var(--ink)}
.doc-meta{font-size:12px;color:var(--muted);margin-top:2px}
.doc-exp{font-size:12px;font-weight:700;white-space:nowrap;flex-shrink:0;text-align:right}
.exp-over{color:var(--red)}
.exp-soon{color:var(--amber)}
.exp-fine{color:var(--green)}
.exp-none{color:var(--muted2)}

/* Upload zone */
.upload-zone{border:2px dashed var(--border2);border-radius:var(--r);padding:22px 16px;text-align:center;cursor:pointer;background:var(--surface);transition:all .2s;-webkit-tap-highlight-color:transparent}
.upload-zone:hover,.upload-zone:active{border-color:var(--teal);background:var(--teal-bg)}
.upload-zone-icon{font-size:32px;margin-bottom:6px;line-height:1}
.upload-zone-title{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:2px}
.upload-zone-sub{font-size:12px;color:var(--muted)}

/* Page preview chips */
.page-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-top:12px}
.page-thumb{position:relative;border-radius:var(--r-sm);overflow:hidden;background:var(--surface);border:1.5px solid var(--border)}
.page-thumb img{width:100%;height:80px;object-fit:cover;display:block}
.page-thumb-label{font-size:10px;font-weight:600;color:var(--muted);text-align:center;padding:4px}
.page-thumb-remove{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(192,57,43,.9);color:#fff;font-size:11px;font-weight:700;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}

/* Fieldgrid for confirm form */
.fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fieldgrid .full{grid-column:1/-1}

/* Filters */
.filter-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.filter-row input,.filter-row select{flex:1;min-width:120px;font-size:13px;padding:9px 12px}

/* Plans grid */
.plans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.plan-card{border-radius:var(--r-sm);padding:14px 12px;border:1.5px solid var(--border);background:var(--bg);text-align:center}
.plan-card.current-plan{border-color:var(--teal);background:var(--teal-bg)}
.plan-name{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.plan-price{font-size:19px;font-weight:800;color:var(--ink);line-height:1.1}
.plan-price span{font-size:11px;font-weight:400;color:var(--muted)}
.plan-features{font-size:11.5px;color:var(--muted);margin-top:8px;text-align:left;line-height:1.7}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(26,36,51,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.modal-box{background:var(--bg);border-radius:var(--r-lg);padding:24px;max-width:340px;width:100%;box-shadow:var(--shadow-md)}
.modal-title{font-size:16px;font-weight:700;margin-bottom:8px}
.modal-body{font-size:13.5px;color:var(--muted);line-height:1.55;margin-bottom:18px}

/* Progress bar (compression feedback) */
.compress-bar{height:3px;background:var(--border);border-radius:99px;margin-top:6px;overflow:hidden}
.compress-bar-fill{height:100%;background:var(--teal);transition:width .3s}
.size-badge{font-size:11px;color:var(--green);font-weight:600;margin-top:2px}

/* Divider */
.divider{border:none;border-top:1px solid var(--border);margin:16px 0}

/* Scrollable tag list */
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:11.5px;padding:3px 10px;border-radius:99px;background:var(--surface2);color:var(--ink2);font-weight:500}
.tag-active{background:var(--teal);color:#fff}

@media(max-width:480px){
  .statgrid{grid-template-columns:repeat(2,1fr)}
  .plans-grid{grid-template-columns:1fr}
  .fieldgrid{grid-template-columns:1fr}
  .fieldgrid .full{grid-column:1}
}
</style>
</head>

<script type="text/plain" id="appsrc">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ═══════════════════════════════════════════════════════════════
   CONFIG — pre-filled for Indo Japan deployment
   ═══════════════════════════════════════════════════════════════ */
const SUPABASE_URL      = "https://lxnsipefybuorwtsxhlw.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4bnNpcGVmeWJ1b3J3dHN4aGx3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3MTU5NzUsImV4cCI6MjA5ODI5MTk3NX0.iIH1ZRXbUUiPklMOo2akQYipP3BR6h8UtnHVKzlJvOI";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ═══════════════════════════════════════════════════════════════
   USER PLANS
   ═══════════════════════════════════════════════════════════════ */
const PLANS = {
  free:     { id:"free",     name:"Personal",  badge:"FREE",     docs:25,   users:1,  price:"₹0",         priceNote:"forever",    color:"var(--muted)" },
  family:   { id:"family",   name:"Family",    badge:"FAMILY",   docs:200,  users:5,  price:"₹299",       priceNote:"/month",     color:"var(--blue)" },
  business: { id:"business", name:"Business",  badge:"PRO",      docs:99999,users:15, price:"₹799",       priceNote:"/month",     color:"var(--teal)" },
};
const getPlan = (p) => PLANS[p] || PLANS.free;

/* ═══════════════════════════════════════════════════════════════
   AI PROVIDER  (Gemini free → Claude API later: swap this block)
   18 document type playbooks — aligned with DocAlert infographic
   ═══════════════════════════════════════════════════════════════ */
const DOC_TYPES = {
  "Driving License":   { icon:"🪪", hint:"expiry = licence validity date. ref_number = licence number (e.g. WB-19....). holder = driver name. Note class of vehicle in summary." },
  "Vehicle RC":        { icon:"🚗", hint:"expiry = registration validity date. ref_number = registration number (e.g. WB01AB1234). holder = owner name. Note vehicle make/model in summary." },
  "PUC Certificate":   { icon:"💨", hint:"expiry = 'valid upto' date. ref_number = certificate number. Note vehicle registration number in summary." },
  "Insurance Policy":  { icon:"🛡️", hint:"expiry_date = 'period of insurance TO' or renewal date. amount = annual premium incl. GST. ref_number = policy number. holder = insured name. Note sum insured in summary." },
  "Mediclaim Policy":  { icon:"🏥", hint:"expiry = renewal date. amount = annual premium. ref_number = policy number. holder = primary insured. Note sum insured, network hospitals in summary." },
  "Passport":          { icon:"📕", hint:"expiry = passport expiry date. ref_number = passport number. holder = passport holder full name. Note date of birth and place of issue in summary." },
  "Visa":              { icon:"✈️", hint:"expiry = visa valid until date. holder = visa holder name. ref_number = visa/folio number. Note country, single/multiple entry in summary." },
  "PAN Card":          { icon:"🪪", hint:"No expiry — set expiry_date to null. ref_number = 10-digit PAN number. holder = card holder name." },
  "Aadhaar Card":      { icon:"🆔", hint:"No expiry — set expiry_date to null. ref_number = last 4 digits of Aadhaar only. holder = card holder name." },
  "Property Document": { icon:"🏠", hint:"expiry = registration validity or lease end if applicable. ref_number = survey number or registration number. holder = property owner. issuer = registrar office. Note property address in summary." },
  "Loan Document":     { icon:"🏦", hint:"expiry = loan closure/maturity date. amount = EMI amount per month. ref_number = loan account number. holder = borrower name. issuer = lender. Note total principal in summary." },
  "School Fee Receipt":{ icon:"🎓", hint:"issue_date = fee payment date. expiry = next due date if stated. amount = amount paid. ref_number = receipt number. holder = student name. Note class/academic year in summary." },
  "Fire NOC":          { icon:"🔥", hint:"expiry = 'valid up to / valid till'. issuer = Fire & Emergency Services dept. ref_number = NOC/memo number." },
  "Trade License":     { icon:"📋", hint:"expiry = 'valid till' or renewal-due date. issuer = municipal corporation. ref_number = licence number." },
  "Lease Agreement":   { icon:"🔑", hint:"expiry = lease end date. amount = monthly rent. holder = lessee. issuer = lessor. Note lock-in period and escalation in summary." },
  "AMC":               { icon:"🔧", hint:"expiry = contract end date. amount = annual contract value. issuer = service vendor. Note scope of services in summary." },
  "Work Order":        { icon:"📄", hint:"expiry = completion/validity date if stated. amount = order value. ref_number = WO number. issuer = client issuing the WO." },
  "Invoice":           { icon:"🧾", hint:"issue_date = invoice date. amount = grand total. ref_number = invoice number. expiry = payment due date if stated, else null." },
  "Other":             { icon:"📁", hint:"Extract whatever fields are visible: dates, amounts, reference numbers, parties involved." },
};

const AI = {
  provider:"gemini", model:"gemini-2.5-flash",
  mode:null,
  getKey:()=>localStorage.getItem("doctrack_key")||"",
  setKey:(k)=>localStorage.setItem("doctrack_key",k.trim()),
  resetMode:()=>{ AI.mode=null; },

  buildPrompt(extra){
    const hints = Object.entries(DOC_TYPES).map(([k,v])=>"- "+k+": "+v.hint).join("\n");
    return "You are a document intelligence engine for an Indian business group.\n"
     +(extra?extra+"\n":"")
     +"Read the document and return ONLY a valid JSON object (no markdown, no code fences) with these exact keys:\n"
     +'{"doc_type":"one of: '+Object.keys(DOC_TYPES).join(", ")+'",'
     +'"title":"short descriptive title",'
     +'"issuer":"issuing authority or company or null",'
     +'"holder":"person or company the document belongs to or null",'
     +'"ref_number":"main reference or number or null",'
     +'"issue_date":"YYYY-MM-DD or null",'
     +'"expiry_date":"YYYY-MM-DD or null",'
     +'"amount":number_or_null,'
     +'"summary":"one plain sentence describing what this document is"}\n'
     +"Type-specific rules:\n"+hints+"\n"
     +"CRITICAL: Indian dates are usually DD/MM/YYYY — always convert to YYYY-MM-DD.\n"
     +"If a field is not present in the document, return null for it. Never invent values.";
  },

  parseResponse(data){
    let text=((data?.candidates?.[0]?.content?.parts?.[0]?.text)||"");
    text=text.replace(/```json|```/g,"").trim();
    if(!text) throw new Error("AI returned an empty response. Try a clearer photo with good lighting.");
    try{ return JSON.parse(text); }
    catch(_){ throw new Error("AI could not read this document. Ensure all text is visible and the photo is well-lit."); }
  },

  async callServer(parts){
    const {data,error}=await sb.functions.invoke("ai-extract",{body:{parts}});
    if(error) throw new Error("edge:"+( error.message||"function unavailable"));
    if(data?.error) throw new Error("edge:"+data.error);
    return AI.parseResponse(data);
  },

  async callBrowser(parts){
    const key=AI.getKey();
    if(!key) throw new Error("No Gemini key found. Tap ⚙ Settings and add your Gemini API key.");
    const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+AI.model+":generateContent?key="+key,
      {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts}]})});
    if(!res.ok){const t=await res.text(); throw new Error("Gemini "+res.status+": "+t.slice(0,160));}
    return AI.parseResponse(await res.json());
  },

  async call(parts){
    if(AI.mode==="browser") return AI.callBrowser(parts);
    try{ const out=await AI.callServer(parts); AI.mode="server"; return out; }
    catch(e){
      if(String(e.message).startsWith("edge:")&&AI.getKey()){ AI.mode="browser"; return AI.callBrowser(parts); }
      throw e;
    }
  },

  async extractFiles(fileParts){
    const note=fileParts.length>1?"The following "+fileParts.length+" images are pages of ONE single document. Combine all pages to produce one result.":"";
    return AI.call([{text:AI.buildPrompt(note)}].concat(fileParts));
  },

  async extractText(text,kindNote){
    return AI.call([{text:AI.buildPrompt("The content below was extracted from "+kindNote+".")},{text:text.slice(0,100000)}]);
  }
};

/* ═══════════════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════════════ */
const fmtBytes=(b)=>b<1024?b+"B":b<1048576?Math.round(b/1024)+"KB":+(b/1048576).toFixed(1)+"MB";
const fileToBase64=(file)=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=()=>rej(new Error("Cannot read file"));r.readAsDataURL(file);});
const fileToDataURL=(file)=>new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=()=>rej(new Error("Cannot read file"));r.readAsDataURL(file);});
const fileToAB=(file)=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error("Cannot read file"));r.readAsArrayBuffer(file);});

/* Fix DATE-1: local midnight normalization */
const daysTo=(d)=>{
  if(!d) return null;
  const exp=new Date(d+"T00:00:00");
  const today=new Date(); today.setHours(0,0,0,0);
  return Math.round((exp-today)/86400000);
};
const expClass=(n)=>n===null?"":n<0?"exp-over":n<=30?"exp-soon":"exp-fine";
const expLabel=(n)=>n===null?"no expiry":n<0?(-n)+"d overdue":n===0?"due today":n+"d left";

/* Fix TYPE-1: broad image detection */
const isImg=(f)=>f.type.startsWith("image/")||(!f.type&&/\.(jpg|jpeg|png|webp|heic|heif)$/i.test(f.name));
const isPdf=(f)=>f.type==="application/pdf"||(!f.type&&f.name.toLowerCase().endsWith(".pdf"));
const isDocx=(f)=>f.name.toLowerCase().endsWith(".docx");
const isXlsx=(f)=>/\.(xlsx|xls|csv)$/i.test(f.name);

const netCheck=()=>{
  if(typeof navigator!=="undefined"&&navigator.onLine===false)
    throw new Error("No internet. Please check your connection.");
};

/* Optimised compression: 1400px, two-pass quality */
const compressImg=async(file)=>{
  if(!isImg(file)||file.size<250*1024) return {file,savings:null};
  const tryCompress=(q)=>new Promise(res=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      try{
        const MAX=1400;
        let{width:w,height:h}=img;
        if(Math.max(w,h)>MAX){const s=MAX/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
        const c=document.createElement("canvas");c.width=w;c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        c.toBlob(res,"image/jpeg",q);
      }catch(_){URL.revokeObjectURL(url);res(null);}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);res(null);};
    img.src=url;
  });
  let blob=await tryCompress(0.78);
  if(blob&&blob.size>550*1024) blob=await tryCompress(0.65)||blob;
  if(!blob||blob.size>=file.size) return {file,savings:null};
  const newFile=new File([blob],file.name.replace(/\.\w+$/,"")+".jpg",{type:"image/jpeg"});
  return{file:newFile,savings:{before:file.size,after:blob.size}};
};

/* ═══════════════════════════════════════════════════════════════
   LOGIN
   ═══════════════════════════════════════════════════════════════ */
function Login(){
  const[email,setEmail]=useState("");
  const[pw,setPw]=useState("");
  const[mode,setMode]=useState("in");
  const[msg,setMsg]=useState(null);
  const[busy,setBusy]=useState(false);

  const go=async()=>{
    if(!email.trim()){setMsg({t:"err",m:"Please enter your email."});return;}
    setBusy(true);setMsg(null);
    if(mode==="reset"){
      const{error}=await sb.auth.resetPasswordForEmail(email.trim(),{redirectTo:window.location.href});
      setBusy(false);
      setMsg(error?{t:"err",m:error.message}:{t:"ok",m:"Password reset link sent — check your inbox."});
      return;
    }
    if(mode==="up"&&pw.length<8){setBusy(false);setMsg({t:"err",m:"Password must be at least 8 characters."});return;}
    const{error}=mode==="in"
      ?await sb.auth.signInWithPassword({email:email.trim(),password:pw})
      :await sb.auth.signUp({email:email.trim(),password:pw});
    setBusy(false);
    if(error){
      const m=error.message.includes("Email not confirmed")
        ?"Account created but email not yet confirmed. Check your inbox — or ask your admin to disable email confirmation in Supabase → Authentication settings."
        :error.message;
      setMsg({t:"err",m});
    }
    else if(mode==="up") setMsg({t:"ok",m:"Account created! Sign in to continue."});
  };
  const onKey=(e)=>{if(e.key==="Enter"&&!busy)go();};

  return(
    <div style={{maxWidth:420,margin:"50px auto"}}>
      <div className="card">
        <div style={{textAlign:"center",marginBottom:20}}>
          <div className="brand" style={{fontSize:26,letterSpacing:"-.03em"}}>DOCTRACK</div>
          <div style={{fontSize:13,color:"var(--muted)",marginTop:3}}>Indo Japan · Document Intelligence</div>
        </div>
        {mode!=="reset"&&<React.Fragment>
          <label>Email</label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={onKey} autoComplete="email" placeholder="you@company.com"/>
          <label>Password</label>
          <input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={onKey}
                 autoComplete={mode==="in"?"current-password":"new-password"} placeholder="••••••••"/>
          <button className="btn btn-primary" style={{marginTop:14}} disabled={busy} onClick={go}>
            {busy?<React.Fragment><span className="spin"></span>Please wait…</React.Fragment>
                 :mode==="in"?"Sign in":"Create account"}
          </button>
          <button className="btn btn-ghost" style={{marginTop:8}} onClick={()=>{setMode(mode==="in"?"up":"in");setMsg(null);}}>
            {mode==="in"?"New to DOCTRACK? Create account":"Have an account? Sign in"}
          </button>
          <div style={{textAlign:"center",marginTop:12}}>
            <a href="#" style={{fontSize:12.5,color:"var(--muted)"}} onClick={e=>{e.preventDefault();setMode("reset");setMsg(null);}}>Forgot password?</a>
          </div>
        </React.Fragment>}
        {mode==="reset"&&<React.Fragment>
          <label>Your email address</label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={onKey} autoFocus placeholder="you@company.com"/>
          <button className="btn btn-primary" disabled={busy} onClick={go}>{busy?"Sending…":"Send reset link"}</button>
          <button className="btn btn-ghost" style={{marginTop:8}} onClick={()=>{setMode("in");setMsg(null);}}>Back to sign in</button>
        </React.Fragment>}
        {msg&&<div className={"alert "+(msg.t==="err"?"alert-err":"alert-ok")} style={{marginTop:12}}>{msg.m}</div>}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   UPLOADER — scan + upload, multi-page, preview thumbnails
   ═══════════════════════════════════════════════════════════════ */
function Uploader({entities,docs,profile,onSaved}){
  const[stage,setStage]=useState("idle");
  const[files,setFiles]=useState([]);
  const[previews,setPreviews]=useState([]);
  const[savings,setSavings]=useState([]);
  const[fields,setFields]=useState(null);
  const[entityId,setEntity]=useState("");
  const[err,setErr]=useState(null);
  const fileRef=useRef(); const camRef=useRef();

  const plan=getPlan(profile?.plan);
  const isAdmin=profile?.role==="admin";
  const docCount=docs.length;
  const atLimit=!isAdmin&&docCount>=plan.docs;

  const addFiles=async(list)=>{
    const arr=Array.from(list||[]);
    if(!arr.length) return;
    setErr(null);
    try{netCheck();}catch(e){setErr(e.message);return;}
    if(atLimit){setErr("You've reached your "+plan.name+" plan limit ("+plan.docs+" documents). Upgrade to add more.");return;}
    const tooBig=arr.find(f=>f.size>15*1024*1024);
    if(tooBig){setErr('"'+tooBig.name.slice(0,30)+'" is over 15MB. Photograph the pages instead.');return;}
    const office=arr.find(f=>isDocx(f)||isXlsx(f));
    if(office){await extract([office]);return;}
    const good=arr.filter(f=>isImg(f)||isPdf(f));
    if(!good.length){setErr("Unsupported file type. Accepted: photos, PDFs, Word (.docx), Excel (.xlsx, .csv).");return;}
    const results=[];
    const prevs=[];
    const svgs=[];
    for(const f of good){
      const{file:cf,savings:sv}=await compressImg(f);
      results.push(cf);
      if(isImg(cf)){
        try{const pu=await fileToDataURL(cf);prevs.push(pu);}catch(_){prevs.push(null);}
      } else prevs.push(null);
      svgs.push(sv);
    }
    setFiles(prev=>[...prev,...results]);
    setPreviews(prev=>[...prev,...prevs]);
    setSavings(prev=>[...prev,...svgs]);
  };

  const removePage=(i)=>{
    setFiles(prev=>prev.filter((_,j)=>j!==i));
    setPreviews(prev=>prev.filter((_,j)=>j!==i));
    setSavings(prev=>prev.filter((_,j)=>j!==i));
  };

  const extract=async(fileList)=>{
    const use=fileList||files;
    if(!use.length) return;
    setStage("extracting");setErr(null);
    try{
      netCheck();
      let out;const f0=use[0];
      if(isDocx(f0)){
        const buf=await fileToAB(f0);
        const res=await mammoth.extractRawText({arrayBuffer:buf});
        out=await AI.extractText(res.value,"a Word document");
      }else if(isXlsx(f0)){
        const buf=await fileToAB(f0);
        const wb=XLSX.read(buf,{type:"array"});
        const csv=wb.SheetNames.map(n=>"--- Sheet: "+n+" ---\n"+XLSX.utils.sheet_to_csv(wb.Sheets[n])).join("\n");
        out=await AI.extractText(csv,"an Excel/CSV spreadsheet");
      }else{
        const parts=[];
        for(const f of use){
          const mt=(f.type==="image/heic"||f.type==="image/heif")?"image/jpeg":(f.type||"image/jpeg");
          parts.push({inline_data:{mime_type:mt,data:await fileToBase64(f)}});
        }
        out=await AI.extractFiles(parts);
      }
      setFiles(use);
      setFields({...out,entity_id:entityId||(entities[0]?.id||"")});
      setStage("confirm");
    }catch(e){
      setErr((e?.message)||"Extraction failed. Check internet and try again.");
      setStage("idle");
    }
  };

  const save=async()=>{
    setStage("saving");setErr(null);
    const uploaded=[];
    try{
      netCheck();
      const stamp=Date.now();
      for(let i=0;i<files.length;i++){
        const f=files[i];
        const path=stamp+"_p"+(i+1)+"_"+f.name.replace(/[^\w.\-]/g,"_");
        const{error:upErr}=await sb.storage.from("documents").upload(path,f);
        if(upErr) throw upErr;
        uploaded.push(path);
      }
      const f0=files[0];
      const ftype=isPdf(f0)?"pdf":isDocx(f0)?"docx":isXlsx(f0)?"xlsx":"image";
      const raw=fields.amount;
      const amt=(raw!=null&&raw!=="")?(isNaN(Number(raw))?null:Number(raw)):null;
      const{error:dbErr}=await sb.from("documents").insert({
        entity_id:fields.entity_id||null,
        title:fields.title||null,
        doc_type:fields.doc_type||"Other",
        issuer:fields.issuer||null,
        holder:fields.holder||null,
        ref_number:fields.ref_number||null,
        issue_date:fields.issue_date||null,
        expiry_date:fields.expiry_date||null,
        amount:amt,
        extracted:{...fields,pages:uploaded},
        ai_provider:AI.provider,
        storage_path:uploaded[0],
        file_type:ftype
      });
      if(dbErr) throw dbErr;
      setStage("idle");setFiles([]);setFields(null);setPreviews([]);setSavings([]);onSaved();
    }catch(e){
      if(uploaded.length>0){try{await sb.storage.from("documents").remove(uploaded);}catch(_){}}
      setErr((e?.message)||"Save failed. Please try again.");
      setStage("confirm");
    }
  };

  const needsKey=AI.mode!=="server"&&!AI.getKey();

  // ── Confirm screen ──────────────────────────────────────────
  if(stage==="confirm"||stage==="saving"){
    const F=(k,lbl,type)=>(
      <div className={k==="title"?"full":""}>
        <label>{lbl}</label>
        <input type={type||"text"} value={fields[k]??""} onChange={e=>setFields({...fields,[k]:e.target.value})}/>
      </div>
    );
    return(
      <div className="card">
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
          <h2 style={{marginBottom:0}}>Confirm details</h2>
          <span className="badge badge-teal">AI proposed — you approve</span>
        </div>
        <div className="fieldgrid">
          {F("title","Document title")}
          <div>
            <label>Entity / Owner</label>
            <select value={fields.entity_id} onChange={e=>setFields({...fields,entity_id:e.target.value})}>
              {entities.map(en=><option key={en.id} value={en.id}>{en.name}</option>)}
            </select>
          </div>
          <div>
            <label>Document type</label>
            <select value={fields.doc_type||"Other"} onChange={e=>setFields({...fields,doc_type:e.target.value})}>
              {Object.keys(DOC_TYPES).map(t=><option key={t}>{t}</option>)}
            </select>
          </div>
          {F("ref_number","Reference / number")}
          {F("issuer","Issuer / authority")}
          {F("holder","Holder / owner")}
          {F("issue_date","Issue date","date")}
          {F("expiry_date","Expiry / renewal date","date")}
          {F("amount","Amount (₹)","number")}
        </div>
        {fields.summary&&<div className="alert alert-info" style={{marginTop:10,fontSize:12.5}}>{fields.summary}</div>}
        {files.length>1&&<div className="tag-list" style={{marginTop:8}}>{files.map((_,i)=><span key={i} className="tag">Page {i+1}</span>)}</div>}
        <button className="btn btn-primary" disabled={stage==="saving"} onClick={save} style={{marginTop:14}}>
          {stage==="saving"?<React.Fragment><span className="spin"></span>Saving…</React.Fragment>:"Save to vault"}
        </button>
        <button className="btn btn-ghost" disabled={stage==="saving"} style={{marginTop:8}} onClick={()=>{setStage("idle");setFiles([]);setFields(null);setPreviews([]);setSavings([]);}}>
          Discard
        </button>
        {err&&<div className="alert alert-err">{err}</div>}
      </div>
    );
  }

  // ── Extracting screen ───────────────────────────────────────
  if(stage==="extracting") return(
    <div className="card" style={{textAlign:"center",padding:"30px 20px"}}>
      <div style={{fontSize:32,marginBottom:10}}>🧠</div>
      <div style={{fontWeight:600,fontSize:15}}><span className="spin"></span>Reading {files.length>1?files.length+" pages":"document"}…</div>
      <div style={{fontSize:13,color:"var(--muted)",marginTop:6}}>Usually 5–20 seconds. Keep this page open.</div>
    </div>
  );

  // ── Idle screen ─────────────────────────────────────────────
  const entitiesReady=entities&&entities.length>0;
  return(
    <div className="card">
      <h2>Add a document</h2>

      {needsKey&&(
        <div className="alert alert-warn">
          ⚙ <b>First time?</b> Open Settings above and add your Gemini API key to enable AI scanning.
          Get a free key at <b>aistudio.google.com</b>.
        </div>
      )}
      {atLimit&&(
        <div className="alert alert-warn">
          📋 You've used all {plan.docs} documents in your <b>{plan.name}</b> plan. Contact admin to upgrade.
        </div>
      )}

      {!entitiesReady&&<div style={{color:"var(--muted)",fontSize:13,margin:"8px 0"}}><span className="spin"></span>Loading…</div>}

      {entitiesReady&&!atLimit&&<React.Fragment>
        <label>Entity</label>
        <select value={entityId} onChange={e=>setEntity(e.target.value)}>
          {entities.map(en=><option key={en.id} value={en.id}>{en.name}</option>)}
        </select>

        {/* Two scan paths — camera and file picker */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:14}}>
          <div className="upload-zone" onClick={()=>camRef.current.click()}>
            <div className="upload-zone-icon">📷</div>
            <div className="upload-zone-title">Scan Document</div>
            <div className="upload-zone-sub">Opens camera directly</div>
          </div>
          <div className="upload-zone" onClick={()=>fileRef.current.click()}>
            <div className="upload-zone-icon">📎</div>
            <div className="upload-zone-title">Import File</div>
            <div className="upload-zone-sub">PDF · Photo · Word · Excel</div>
          </div>
        </div>

        {/* Camera: capture="environment" opens rear camera on phone */}
        <input ref={camRef} type="file" accept="image/*" capture="environment" hidden onChange={e=>{addFiles(e.target.files);e.target.value="";}}/>
        {/* File picker: all supported types in single line */}
        <input ref={fileRef} type="file" multiple hidden accept="image/*,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv,.docx,.xlsx,.xls,.csv" onChange={e=>{addFiles(e.target.files);e.target.value="";}}/>

        {/* Staged pages with thumbnails */}
        {files.length>0&&(
          <div style={{marginTop:14}}>
            <div style={{fontSize:12.5,fontWeight:600,color:"var(--muted)",marginBottom:4}}>
              {files.length} page{files.length>1?"s":""} ready
            </div>
            <div className="page-grid">
              {files.map((f,i)=>(
                <div key={i} className="page-thumb">
                  {previews[i]
                    ?<img src={previews[i]} alt={"Page "+(i+1)}/>
                    :<div style={{height:80,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}}>{isPdf(f)?"📄":isDocx(f)?"📝":isXlsx(f)?"📊":"📁"}</div>
                  }
                  <div className="page-thumb-label">Page {i+1}</div>
                  {savings[i]&&<div className="size-badge" style={{position:"absolute",bottom:22,left:4,right:4,textAlign:"center",background:"rgba(255,255,255,.9)",borderRadius:3,padding:"1px 0"}}>
                    {fmtBytes(savings[i].before)} → {fmtBytes(savings[i].after)}
                  </div>}
                  <button className="page-thumb-remove" onClick={()=>removePage(i)}>✕</button>
                </div>
              ))}
              {/* Add more pages button */}
              <div className="upload-zone" style={{minHeight:80,padding:8}} onClick={()=>camRef.current.click()}>
                <div style={{fontSize:22}}>📷</div>
                <div style={{fontSize:11,color:"var(--muted)"}}>Add page</div>
              </div>
            </div>
            <button className="btn btn-primary" style={{marginTop:12}} onClick={()=>extract()}>
              ✨ Extract with AI ({files.length} page{files.length>1?"s":""})
            </button>
            <button className="btn btn-ghost" style={{marginTop:8}} onClick={()=>{setFiles([]);setPreviews([]);setSavings([]);}}>
              Clear all
            </button>
          </div>
        )}
        {err&&<div className="alert alert-err">{err}</div>}
      </React.Fragment>}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   DOCUMENT DETAIL
   ═══════════════════════════════════════════════════════════════ */
function Detail({doc,onClose,onDeleted}){
  const[busy,setBusy]=useState(false);
  const[err,setErr]=useState(null);
  const[confirmDel,setConfirmDel]=useState(false);
  const pages=(doc.extracted?.pages)||[doc.storage_path];
  const typeInfo=DOC_TYPES[doc.doc_type]||DOC_TYPES["Other"];
  const n=daysTo(doc.expiry_date);

  const viewPage=async(idx)=>{
    setBusy(true);setErr(null);
    try{
      const{data,error}=await sb.storage.from("documents").createSignedUrl(pages[idx],3600);
      if(error) throw error;
      window.open(data.signedUrl,"_blank");
    }catch(e){setErr(e.message);}
    setBusy(false);
  };

  const del=async()=>{
    setBusy(true);
    try{
      await sb.storage.from("documents").remove(pages);
      const{error}=await sb.from("documents").delete().eq("id",doc.id);
      if(error) throw error;
      onDeleted();
    }catch(e){setErr(e.message);setBusy(false);}
  };

  return(
    <React.Fragment>
      {confirmDel&&<ConfirmModal title="Delete document?" message="This permanently deletes the document and all its stored files. This cannot be undone." confirmLabel="Yes, delete" onConfirm={()=>{setConfirmDel(false);del();}} onCancel={()=>setConfirmDel(false)}/>}
      <div className="card">
        <div style={{display:"flex",gap:12,alignItems:"flex-start",marginBottom:14}}>
          <div style={{fontSize:32,lineHeight:1}}>{typeInfo.icon}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:16,fontWeight:700,color:"var(--ink)",wordBreak:"break-word"}}>{doc.title||doc.doc_type||"Document"}</div>
            <div style={{fontSize:12,color:"var(--muted)",marginTop:2}}>{doc.doc_type} {doc.entities?.name?"· "+doc.entities.name:""}</div>
          </div>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:"var(--muted)",padding:4,lineHeight:1}}>✕</button>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,fontSize:13}}>
          {[
            ["Reference",doc.ref_number],
            ["Issuer",doc.issuer],
            ["Holder",doc.holder],
            ["Issue date",doc.issue_date],
            doc.expiry_date?["Expiry",<span className={expClass(n)}>{doc.expiry_date} ({expLabel(n)})</span>]:null,
            doc.amount!=null?["Amount","₹"+Number(doc.amount).toLocaleString("en-IN")]:null,
          ].filter(Boolean).map(([k,v],i)=>(
            <div key={i} className="card-surface" style={{padding:"9px 12px",borderRadius:8}}>
              <div style={{fontSize:10.5,fontWeight:600,color:"var(--muted)",textTransform:"uppercase",letterSpacing:".04em"}}>{k}</div>
              <div style={{fontSize:13,fontWeight:600,color:"var(--ink)",marginTop:2}}>{v||"—"}</div>
            </div>
          ))}
        </div>

        {doc.extracted?.summary&&<div className="alert alert-info" style={{marginTop:10,fontSize:12.5}}>{doc.extracted.summary}</div>}

        <div style={{marginTop:14}}>
          {pages.length===1
            ?<button className="btn btn-ghost" disabled={busy} onClick={()=>viewPage(0)}>📂 Open document</button>
            :<React.Fragment>
               <div style={{fontSize:12,color:"var(--muted)",marginBottom:6}}>{pages.length} pages — open individually:</div>
               <div className="btn-row">{pages.map((_,i)=><button key={i} className="btn btn-ghost btn-sm" disabled={busy} style={{flex:"0 0 auto"}} onClick={()=>viewPage(i)}>Page {i+1}</button>)}</div>
             </React.Fragment>
          }
        </div>
        <button className="btn btn-danger" disabled={busy} style={{marginTop:8}} onClick={()=>setConfirmDel(true)}>🗑 Delete</button>
        {err&&<div className="alert alert-err">{err}</div>}
      </div>
    </React.Fragment>
  );
}

/* ═══════════════════════════════════════════════════════════════
   VAULT — dashboard + search + document list
   ═══════════════════════════════════════════════════════════════ */
function Vault({docs,entities,onOpen,loading}){
  const[q,setQ]=useState("");
  const[ent,setEnt]=useState("");
  const[band,setBand]=useState("all");

  const counts=useMemo(()=>{
    let over=0,soon=0,ok=0;
    docs.forEach(d=>{const n=daysTo(d.expiry_date);if(n===null)return;if(n<0)over++;else if(n<=30)soon++;else ok++;});
    return{over,soon,ok,all:docs.length};
  },[docs]);

  const shown=useMemo(()=>docs.filter(d=>{
    const n=daysTo(d.expiry_date);
    if(band==="over"&&!(n!==null&&n<0)) return false;
    if(band==="soon"&&!(n!==null&&n>=0&&n<=30)) return false;
    if(band==="ok"&&!(n!==null&&n>30)) return false;
    if(ent&&d.entity_id!==ent) return false;
    if(q){const h=[d.title,d.doc_type,d.ref_number,d.issuer,d.holder,d.extracted?.summary].join(" ").toLowerCase();if(!h.includes(q.toLowerCase()))return false;}
    return true;
  }),[docs,q,ent,band]);

  const docIcon=(t)=>(DOC_TYPES[t]||DOC_TYPES["Other"]).icon;

  return(
    <div className="card">
      <h2>Your Vault</h2>
      <div className="statgrid">
        {[
          {id:"over",label:"Overdue",n:counts.over,cls:"stat-over"},
          {id:"soon",label:"≤ 30 days",n:counts.soon,cls:"stat-soon"},
          {id:"ok",label:"Safe",n:counts.ok,cls:"stat-ok"},
          {id:"all",label:"All docs",n:counts.all,cls:""},
        ].map(s=>(
          <div key={s.id} className={"stat "+(band===s.id?"active-band ":"")+s.cls} onClick={()=>setBand(band===s.id?"all":s.id)}>
            <div className="sn">{s.n}</div>
            <div className="sl">{s.label}</div>
          </div>
        ))}
      </div>
      <div className="filter-row" style={{marginTop:12}}>
        <input type="search" placeholder="Search title, ref no., issuer…" value={q} onChange={e=>setQ(e.target.value)}/>
        <select value={ent} onChange={e=>setEnt(e.target.value)} style={{minWidth:0,flex:"0 0 auto",maxWidth:150}}>
          <option value="">All entities</option>
          {entities.map(en=><option key={en.id} value={en.id}>{en.name}</option>)}
        </select>
      </div>
      {shown.length===0
        ?<div style={{textAlign:"center",padding:"32px 20px",color:"var(--muted)"}}>
           {loading
             ?<React.Fragment><span className="spin"></span>Loading…</React.Fragment>
             :docs.length===0
               ?<React.Fragment>
                  <div style={{fontSize:36,marginBottom:10}}>📭</div>
                  <div style={{fontWeight:600,color:"var(--ink2)",marginBottom:4}}>Vault is empty</div>
                  <div style={{fontSize:13}}>Scan your first document above — try a Fire NOC or insurance policy.</div>
                </React.Fragment>
               :"No documents match. Clear filters to see all."}
         </div>
        :shown.map(d=>{
           const n=daysTo(d.expiry_date);
           return(
             <div key={d.id} className="doc-row" onClick={()=>onOpen(d)}>
               <div className="doc-icon">{docIcon(d.doc_type)}</div>
               <div style={{flex:1,minWidth:0}}>
                 <div className="doc-title">{d.title||d.doc_type||"Untitled"}</div>
                 <div className="doc-meta">{[d.doc_type,d.entities?.name,d.ref_number].filter(Boolean).join(" · ")}</div>
               </div>
               <div className={"doc-exp "+(n===null?"exp-none":expClass(n))}>
                 {d.expiry_date?<React.Fragment><div>{d.expiry_date}</div><div style={{fontSize:11}}>{expLabel(n)}</div></React.Fragment>:"—"}
               </div>
             </div>
           );
         })
      }
      {docs.length>0&&<div style={{textAlign:"center",fontSize:11.5,color:"var(--muted2)",marginTop:14,paddingTop:10,borderTop:"1px solid var(--border)"}}>{docs.length} document{docs.length>1?"s":""} total</div>}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   TEAM PANEL (admin only)
   ═══════════════════════════════════════════════════════════════ */
function Team({entities,currentUserId,onClose}){
  const[people,setPeople]=useState(null);
  const[access,setAccess]=useState([]);
  const[err,setErr]=useState(null);
  const[busy,setBusy]=useState(false);

  const load=async()=>{
    const[p,a]=await Promise.all([sb.from("profiles").select("*").order("created_at"),sb.from("entity_access").select("*")]);
    if(p.error){setErr(p.error.message);return;}
    if(a.error){setErr(a.error.message);return;}
    setPeople(p.data||[]);setAccess(a.data||[]);
  };
  useEffect(()=>{load();},[]);

  const setRole=async(uid,role)=>{
    if(uid===currentUserId&&role==="member"){setErr("You cannot remove your own admin role.");return;}
    const admins=(people||[]).filter(p=>p.role==="admin");
    if(role==="member"&&admins.length===1&&admins[0].user_id===uid){setErr("Cannot remove the only admin. Promote another user first.");return;}
    setBusy(true);setErr(null);
    const{error}=await sb.from("profiles").update({role}).eq("user_id",uid);
    if(error)setErr(error.message);else await load();
    setBusy(false);
  };

  const toggleAccess=async(uid,eid,has)=>{
    setBusy(true);setErr(null);
    const{error}=has?await sb.from("entity_access").delete().eq("user_id",uid).eq("entity_id",eid)
                     :await sb.from("entity_access").insert({user_id:uid,entity_id:eid});
    if(error)setErr(error.message);else await load();
    setBusy(false);
  };

  if(people===null&&!err) return<div className="card"><span className="spin"></span>Loading team…</div>;
  return(
    <div className="card">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <h2 style={{marginBottom:0}}>👥 Team &amp; Access</h2>
        <span className="badge badge-teal">Admin</span>
      </div>
      <div style={{fontSize:13,color:"var(--muted)",marginBottom:12}}>New staff: they sign up at the login screen, then appear here.</div>
      {(people||[]).map(p=>(
        <div key={p.user_id} style={{borderTop:"1px solid var(--border)",padding:"12px 0"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            <div>
              <div style={{fontWeight:600,fontSize:13.5}}>{p.email||p.user_id.slice(0,14)}</div>
              <div style={{fontSize:11,color:"var(--muted)",marginTop:1}}>{getPlan(p.plan).name} plan</div>
            </div>
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <select style={{width:"auto",fontSize:12,padding:"5px 8px"}} disabled={busy} value={p.role} onChange={e=>setRole(p.user_id,e.target.value)}>
                <option value="member">member</option>
                <option value="admin">admin</option>
              </select>
            </div>
          </div>
          {p.role==="member"&&(
            <div className="tag-list" style={{marginTop:8}}>
              {entities.map(en=>{
                const has=access.some(a=>a.user_id===p.user_id&&a.entity_id===en.id);
                return(
                  <span key={en.id} className={"tag"+(has?" tag-active":"")} style={{cursor:busy?"default":"pointer"}}
                        onClick={()=>!busy&&toggleAccess(p.user_id,en.id,has)}>
                    {has?"✓ ":"+ "}{en.name}
                  </span>
                );
              })}
            </div>
          )}
        </div>
      ))}
      {err&&<div className="alert alert-err">{err}</div>}
      <div className="btn-row" style={{marginTop:8}}>
        <button className="btn btn-ghost" onClick={load} disabled={busy}>↻ Refresh</button>
        <button className="btn btn-ghost" onClick={onClose}>Close</button>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   APP ROOT
   ═══════════════════════════════════════════════════════════════ */
function App(){
  const[session,setSession]=useState(undefined);
  const[profile,setProfile]=useState(null);
  const[currentUid,setUid]=useState(null);
  const[entities,setEntities]=useState([]);
  const[docs,setDocs]=useState([]);
  const[loading,setLoading]=useState(false);
  const[loadErr,setLoadErr]=useState(null);
  const[showSettings,setSettings]=useState(false);
  const[showTeam,setTeam]=useState(false);
  const[showPlans,setPlans]=useState(false);
  const[openDoc,setOpenDoc]=useState(null);

  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSession(data.session));
    const{data:sub}=sb.auth.onAuthStateChange((_e,s)=>setSession(s));
    return()=>sub.subscription.unsubscribe();
  },[]);

  const load=useCallback(async()=>{
    setLoading(true);setLoadErr(null);
    try{
      const{data:{user},error:uErr}=await sb.auth.getUser();
      if(uErr||!user) throw new Error("Session expired — please sign in again.");
      setUid(user.id);
      let{data:prof,error:pErr}=await sb.from("profiles").select("*").eq("user_id",user.id).maybeSingle();
      if(pErr) throw pErr;
      if(!prof){
        const{error:iErr}=await sb.from("profiles").insert({user_id:user.id,email:user.email,role:"member",plan:"free"});
        if(iErr) throw iErr;
        prof={user_id:user.id,email:user.email,role:"member",plan:"free"};
      }
      setProfile(prof);
      const[e,d,a]=await Promise.all([
        sb.from("entities").select("*").order("name"),
        sb.from("documents").select("*,entities(name)").order("expiry_date",{ascending:true,nullsFirst:false}),
        sb.from("entity_access").select("entity_id").eq("user_id",user.id)
      ]);
      const allowed=(a.data||[]).map(x=>x.entity_id);
      const ents=e.data||[];
      setEntities(prof.role==="admin"?ents:ents.filter(en=>allowed.includes(en.id)));
      setDocs(d.data||[]);
    }catch(e){
      setLoadErr((e?.message)||"Failed to load. Check your internet connection.");
    }finally{setLoading(false);}
  },[]);

  useEffect(()=>{if(session)load();},[session]);

  if(session===undefined) return(
    <div style={{textAlign:"center",marginTop:100}}>
      <div style={{fontSize:36,marginBottom:12}}>📋</div>
      <div style={{fontWeight:700,fontSize:18,color:"var(--teal)"}}>DOCTRACK</div>
      <div style={{marginTop:16,color:"var(--muted)"}}><span className="spin"></span>Starting…</div>
    </div>
  );
  if(!session) return<Login/>;
  if(loadErr) return(
    <div className="card" style={{marginTop:40}}>
      <div className="alert alert-err">{loadErr}</div>
      <button className="btn btn-primary" style={{marginTop:10}} onClick={load}>Retry</button>
      <button className="btn btn-ghost" style={{marginTop:8}} onClick={()=>sb.auth.signOut()}>Sign out</button>
    </div>
  );

  const isAdmin=profile?.role==="admin";
  const plan=getPlan(profile?.plan);
  const noAccess=profile&&!isAdmin&&entities.length===0&&!loading;

  return(
    <div>
      {/* Topbar */}
      <div className="topbar">
        <div>
          <span className="brand">DOCTRACK</span>
          <span className="brand-sub">{session.user.email}{isAdmin?" · admin":""}</span>
        </div>
        <div className="topbar-actions">
          <span className="badge badge-teal" style={{cursor:"pointer"}} onClick={()=>setPlans(s=>!s)}>{plan.badge}</span>
          {isAdmin&&<button className="btn btn-ghost btn-sm" onClick={()=>setTeam(s=>!s)}>👥 Team</button>}
          <button className="btn btn-ghost btn-sm" onClick={()=>setSettings(s=>!s)}>⚙</button>
          <button className="btn btn-ghost btn-sm" onClick={()=>sb.auth.signOut()}>Sign out</button>
        </div>
      </div>

      {/* Panels */}
      {showSettings&&<Settings profile={profile} onClose={()=>setSettings(false)}/>}
      {showPlans&&<PlansPanel profile={profile} onClose={()=>setPlans(false)}/>}
      {showTeam&&isAdmin&&<Team entities={entities} currentUserId={currentUid} onClose={()=>setTeam(false)}/>}
      {openDoc&&<Detail doc={openDoc} onClose={()=>setOpenDoc(null)} onDeleted={()=>{setOpenDoc(null);load();}}/>}

      {/* Loading state */}
      {loading&&!profile&&<div className="card" style={{textAlign:"center"}}><span className="spin"></span>Loading your vault…</div>}

      {/* No access */}
      {noAccess&&(
        <div className="card" style={{textAlign:"center",padding:"28px 20px"}}>
          <div style={{fontSize:36,marginBottom:8}}>🔒</div>
          <div style={{fontWeight:700,marginBottom:6}}>No entity access yet</div>
          <div style={{fontSize:13,color:"var(--muted)",marginBottom:14}}>Your account exists but the admin hasn't granted you access to any entity. Contact your admin to open Team and tick your entities.</div>
          <button className="btn btn-ghost btn-sm" onClick={load}>↻ Retry</button>
        </div>
      )}

      {/* Main content */}
      {!noAccess&&profile&&(
        <React.Fragment>
          <Uploader entities={entities} docs={docs} profile={profile} onSaved={load}/>
          <Vault docs={docs} entities={entities} onOpen={setOpenDoc} loading={loading}/>
        </React.Fragment>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
window.addEventListener("DOMContentLoaded",function(){
  try{
    var src=document.getElementById("appsrc").textContent;
    var out=Babel.transform(src,{presets:[["react",{runtime:"classic"}]]}).code;
    var s=document.createElement("script");
    s.textContent=out;
    document.body.appendChild(s);
  }catch(e){
    document.getElementById("root").innerHTML=
      '<div style="max-width:500px;margin:60px auto;padding:24px;font-family:sans-serif;color:#C0392B;background:#FDF2F0;border-radius:12px">'
      +'<b>Startup error — please report this:</b><br><br>'+(e&&e.message?e.message:String(e))+'</div>';
    console.error("DOCTRACK startup:",e);
  }
});
</script>
</body>
</html>
